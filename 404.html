<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>404 — Page Not Found | Sehat</title>
<meta name="description" content="The page you are looking for does not exist. Return to Sehat Rural Health Identity home."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  /* TYPOGRAPHY */
  --font-primary: 'Syne', sans-serif;
  --font-secondary: 'DM Sans', -apple-system, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 28px;

  /* COLOR */
  --color-surface-base: #070d0a;
  --color-surface-muted: #edf5f0;
  --color-surface-raised: #101e16;
  --color-surface-strong: #004d2e;
  --color-accent-primary: #00c97a;
  --color-text-primary: #edf5f0;
  --color-text-secondary: #4a6a5a;
  --color-text-inverse: #141414;
  --color-status-error: #ff5c5c;
  --color-status-success: #00c97a;
  --color-status-warning: #ffb84d;

  /* SPACING */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; 
  --space-4: 16px; --space-5: 24px; --space-6: 40px;

  /* RADIUS / SHADOW / MOTION */
  --radius-xs: 6px; --radius-sm: 12px; --radius-md: 16px; --radius-full: 999px;
  --shadow-card: 0 24px 48px rgba(0,0,0,0.7);
  --shadow-glow: 0 0 40px rgba(0,201,122,0.12);
  --shadow-focus: 0 0 0 3px rgba(0,201,122,0.5);
  --motion-instant: 150ms;
  --motion-fast: 400ms;
  --motion-scene: 600ms;

  --bg: var(--color-surface-base);
  --green: var(--color-accent-primary);
  --white: var(--color-text-primary);
  --muted: var(--color-text-secondary);
  --cb: var(--color-surface-raised);
  --cborder: #1a2e22;
}

body{
  background:var(--color-surface-base);
  color:var(--color-text-primary);
  font-family:var(--font-secondary);
  font-size:var(--font-size-md);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:var(--space-5);
  position:relative;
  overflow:hidden;
}

.bg-glow{
  position:absolute;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(0,201,122,0.12) 0%, transparent 70%);
  border-radius:var(--radius-full);
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  pointer-events:none;
}

.error-code{
  font-family:var(--font-primary);
  font-size:clamp(4.5rem, 12vw, 8.5rem);
  font-weight:800;
  letter-spacing:-4px;
  color:var(--color-accent-primary);
  line-height:1;
  margin-bottom:var(--space-3);
  text-shadow:0 0 30px rgba(0,201,122,0.3);
}

h1{
  font-family:var(--font-primary);
  font-size:clamp(1.4rem, 3.2vw, 2.2rem);
  font-weight:800;
  margin-bottom:var(--space-3);
}

p{
  color:var(--color-text-secondary);
  font-size:var(--font-size-md);
  max-width:440px;
  line-height:1.6;
  margin-bottom:var(--space-5);
}

.btn-home{
  background:var(--color-accent-primary);
  color:var(--color-text-inverse);
  padding:var(--space-3) var(--space-5);
  border-radius:var(--radius-full);
  font-family:var(--font-primary);
  font-weight:700;
  font-size:var(--font-size-sm);
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  min-width:160px;
  transition:all var(--motion-instant) ease;
}

.btn-home:hover{
  background:#00df88;
  transform:translateY(-1px);
  box-shadow:var(--shadow-glow);
}

.btn-home:focus-visible{
  outline:none;
  box-shadow:var(--shadow-focus);
}

.btn-home:active{
  transform:translateY(1px);
}
</style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="error-code" aria-hidden="true">404</div>
  <h1>Record Not Found</h1>
  <p>The health record or page you're searching for does not exist in local storage or the network.</p>
  <a href="/" class="btn-home" aria-label="Return to Sehat Homepage">Return to Sehat Home →</a>
</body>
</html>
